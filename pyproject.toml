[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-control"
version = "0.1.0"
description = "Canonical robot control and Real2Sim tooling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
hdf5 = ["h5py>=3.8"]
test = ["pytest>=7"]

[project.scripts]
robotctl = "robot_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_control = ["profiles/*.yaml"]
openarm_quest_teleop = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
