name: openarm_leap
components: [openarm, leap]
asset:
  # OpenArm pair with a LEAP Hand on each arm (16 Dynamixel joints per hand, no
  # mimic). The asset is the urdf repo's canonical openarm_leap_bi_rl (branch
  # feat/leap-hand), the same file the Isaac asset and the Jazzy split bringup
  # (openarm_leap_arms.launch.py) use; its control_joint_order is exactly the
  # 46 joints below. ⚠ The hand mount is still the RH56F1 adapter height
  # (urdf assemblies/openarm_modular_dual_leap.xacro) until the LEAP adapter
  # is measured; regenerating the asset changes manifest_sha256.
  id: openarm_leap_bi_rl
  manifest: ../../../../urdf/generated/rl/openarm_leap_bi_rl_manifest.yaml
  manifest_sha256: ebb7fbca23879829fc9f1b4e4bcb8f6ef5c9da1680434720a3a3f98908ada690
  urdf: ../../../../urdf/generated/rl/openarm_leap_bi_rl.urdf
ros:
  humble:
    command_rate_hz: 100
  jazzy:
    command_rate_hz: 100
# Arms: same OpenArm joints, limits and fake controllers as openarm_rh56f1
# (openarm_leap_arms.launch.py runtime:=fake). No real arm runtime exists for
# this asset yet, so no real controller is named. asset_tip_link is the LEAP
# palm (r_hj_mount: r_al_7 -> r_hl_palm), the Quest teleop control frame.
groups:
  openarm_right_arm:
    joints: [r_aj_1, r_aj_2, r_aj_3, r_aj_4, r_aj_5, r_aj_6, r_aj_7]
    hdgp_group: openarm_right_arm
    controller: right_joint_trajectory_controller
    asset_tip_link: r_hl_palm
  openarm_left_arm:
    joints: [l_aj_1, l_aj_2, l_aj_3, l_aj_4, l_aj_5, l_aj_6, l_aj_7]
    hdgp_group: openarm_left_arm
    controller: left_joint_trajectory_controller
    asset_tip_link: l_hl_palm
  # Each hand runs its own fake controller manager under /leap_<side>
  # (leap_hand.launch.py): its trajectory controller is namespaced, so these
  # groups name no root-level controller. Source names are the LEAP_Hand_API
  # motor indices (leap_right_0..15); the canonical `_1.._4` follow the finger
  # chain, not the motor index.
  leap_right_hand:
    joints: [r_hj_thumb_1, r_hj_thumb_2, r_hj_thumb_3, r_hj_thumb_4, r_hj_index_1, r_hj_index_2, r_hj_index_3, r_hj_index_4, r_hj_middle_1, r_hj_middle_2, r_hj_middle_3, r_hj_middle_4, r_hj_ring_1, r_hj_ring_2, r_hj_ring_3, r_hj_ring_4]
    state_topic: /leap_right/joint_states
  leap_left_hand:
    joints: [l_hj_thumb_1, l_hj_thumb_2, l_hj_thumb_3, l_hj_thumb_4, l_hj_index_1, l_hj_index_2, l_hj_index_3, l_hj_index_4, l_hj_middle_1, l_hj_middle_2, l_hj_middle_3, l_hj_middle_4, l_hj_ring_1, l_hj_ring_2, l_hj_ring_3, l_hj_ring_4]
    state_topic: /leap_left/joint_states
# Joint limits: arms from the OpenArm profile; hands from the asset URDF
# (dex-urdf LEAP limits, velocity 8.48, effort 0.5 as the official LEAP sim).
