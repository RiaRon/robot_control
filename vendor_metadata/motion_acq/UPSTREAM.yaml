name: motion_acq
source: https://github.com/KUKU-Robot-Lab/motion_acq (main, by divingyoon; derived from HandUMI, murobotics-ai/handumi-sw)
commit: 01dc218
imported_at: 2026-10-27
license: Apache-2.0  # vendor_metadata/motion_acq/LICENSE, copied unchanged
purpose: >-
  quest_view (the Quest Browser WebXR page: head camera in the headset, poses back to the PC on
  TCP 65432) and the neck (headset yaw/pitch -> Dynamixel pan/tilt), used by the OpenArm + LEAP
  teleop on ROS 2 Jazzy.
vendored:
  src/openarm_quest_view/: quest_view/{__init__,server,convert,front,devtools,link}.py, quest_view/web/*
  src/openarm_head/: head/{__init__,config,retarget,dynamixel,session}.py, filters.py
  scripts/quest_view.sh: scripts/quest_usb.sh
  tests/: test_head_retarget.py, test_head_sdk_bus.py, test_quest_link.py, head_helpers.py
not_vendored: the arm teleop (DLS / pyroki IK, openarm_can driver), tracking providers, recorder, console, hand (RH56F1 / Nova 2)
local_modifications:
  - imports renamed motion_acq.quest_view -> openarm_quest_view, motion_acq.head / motion_acq.filters -> openarm_head
  - server.py: no motion_acq.cpu keep_off_rt (no RH56F1 EtherCAT cores here)
  - head/retarget.py: local quat_to_matrix instead of motion_acq.tracking.transforms
  - head/session.py: HmdSample dataclass instead of motion_acq.tracking.base.ControllerPairSample (same fields read)
  - head/config.py: reads the head section from a YAML file directly (no station rig loader)
  - head/dynamixel.py: install hint for dynamixel-sdk points at robot_control/.venv
  - scripts/head_teleop.py -> src/openarm_head/ros_head.py (new file): same start / follow / home loop, headset pose and front from the bridge's ROS topics, measured angles to /openarm_leap/head/joint_states
  - quest_usb.sh -> quest_view.sh: HandUMI app commands (install, forward, launch, app) removed; devtools module path
  - web/index.html: title
  - script references quest_usb.sh -> quest_view.sh (server.py, link.py, web/viewer.js); server.py usage line
  - tests: imports and script name; test_mock_unity_motion_signs_match_tracking_frame replaced by a WebXR -> quest_view -> bridge sign test
